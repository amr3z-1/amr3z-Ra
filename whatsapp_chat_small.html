<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Comfort Zone ❤️ – WhatsApp</title>
<style>
:root{--bg:#efeae2;--bg2:#e5ddd5;--hd:#008069;--hdt:#fff;--out:#d9fdd3;--in:#fff;--tx:#111b21;--sub:#667781;--pill:#fff;--sys:#fff3c5;--tick:#53bdeb;--wave:#8696a0;--sh:0 1px .5px rgba(11,20,26,.13)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b141a;--bg2:#0b141a;--hd:#202c33;--out:#005c4b;--in:#202c33;--tx:#e9edef;--sub:#8696a0;--pill:#182229;--sys:#182229;--wave:#8696a0}}
:root[data-theme="dark"]{--bg:#0b141a;--bg2:#0b141a;--hd:#202c33;--out:#005c4b;--in:#202c33;--tx:#e9edef;--sub:#8696a0;--pill:#182229;--sys:#182229;--wave:#8696a0}
*{box-sizing:border-box}
html{scroll-padding-top:calc(60px + env(safe-area-inset-top,0px))}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:11}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--hd);color:var(--hdt);display:flex;align-items:center;gap:10px;padding:8px 12px;min-height:56px}
header .av{width:40px;height:40px;border-radius:50%;background:#dfe5e7;display:grid;place-items:center;font-size:20px;flex:none}
header .ti{flex:1;min-width:0}
header b{display:block;font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header small{opacity:.8;font-size:12px}
header button{background:none;border:0;color:inherit;font-size:19px;cursor:pointer;padding:6px 8px;border-radius:8px}
header button:hover{background:rgba(255,255,255,.12)}
#sb{display:none;position:sticky;top:calc(56px + env(safe-area-inset-top,0px));z-index:9;background:var(--hd);padding:0 12px 10px;gap:6px;align-items:center}
#sb.on{display:flex}
#sb input{flex:1;min-width:0;border:0;border-radius:8px;padding:9px 12px;font:inherit;background:var(--in);color:var(--tx);outline:0}
#sb span{color:var(--hdt);font-size:12px;min-width:56px;text-align:center}
#sb button{background:none;border:0;color:var(--hdt);font-size:18px;cursor:pointer}
main{max-width:900px;margin:0 auto;padding:8px 8px calc(24px + env(safe-area-inset-bottom,0px));background-image:radial-gradient(var(--bg2) 1px,transparent 1px);background-size:22px 22px;min-height:100vh}
section{content-visibility:auto;contain-intrinsic-size:auto 1500px}
.dp,.sy{text-align:center;margin:10px 0}
.dp span,.sy span{display:inline-block;background:var(--pill);color:var(--sub);font-size:12.5px;padding:4px 12px;border-radius:8px;box-shadow:var(--sh)}
.sy span{background:var(--sys);max-width:90%;font-size:12px}
.m{position:relative;width:fit-content;max-width:min(78%,560px);padding:5px 8px 4px;margin:1px 0;border-radius:8px;box-shadow:var(--sh);overflow-wrap:anywhere;direction:ltr}
.m.o{background:var(--out);margin-left:auto;margin-right:6px}
.m.i{background:var(--in);margin-right:auto;margin-left:6px}
.m.f{margin-top:7px}
.m.f.o{border-top-right-radius:0}.m.f.i{border-top-left-radius:0}
.m.f.o::after{content:"";position:absolute;top:0;right:-7px;border:7px solid transparent;border-top-color:var(--out);border-left-color:var(--out)}
.m.f.i::after{content:"";position:absolute;top:0;left:-7px;border:7px solid transparent;border-top-color:var(--in);border-right-color:var(--in)}
.m p{margin:0;white-space:normal}
.m p[dir=auto]{unicode-bidi:plaintext}
.m a{color:#027eb5;word-break:break-all}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .m a{color:#53bdeb}}
:root[data-theme="dark"] .m a{color:#53bdeb}
.m i{display:block;text-align:right;font-style:normal;font-size:11px;color:var(--sub);margin-top:1px;direction:ltr;line-height:1.1}
.m.o i::after{content:" ✓✓";color:var(--tick);letter-spacing:-2px}
.a{color:var(--sub);font-style:italic;font-size:14px}
.v{display:flex;align-items:center;gap:8px;min-width:190px;direction:ltr}
.v b{font-size:18px;color:var(--wave);width:26px}
.v s{flex:1;height:22px;background:repeating-linear-gradient(90deg,var(--wave) 0 2px,transparent 2px 5px);opacity:.8;border-radius:2px;text-decoration:none}
.im,.st{display:grid;place-items:center;gap:2px;font-size:34px;background:rgba(134,150,160,.18);border-radius:6px;padding:14px 38px;text-align:center}
.im span,.st span{font-size:12px;color:var(--sub)}
.st{background:none;padding:6px 14px}
.d{background:rgba(134,150,160,.18);padding:10px 12px;border-radius:6px;font-size:14px}
audio{width:240px;max-width:100%;height:40px;display:block;direction:ltr}
.pic{display:block}.pic img,.m video{display:block;max-width:100%;width:auto;max-height:340px;border-radius:6px;background:rgba(134,150,160,.18)}
.m video{width:300px}
.stk{width:140px;height:140px;object-fit:contain;display:block}
.m a.d{display:block;text-decoration:none;color:var(--tx)}
.miss{display:grid;place-items:center;gap:2px;font-size:30px;background:rgba(134,150,160,.18);border-radius:6px;padding:12px 30px;text-align:center}
.miss span{font-size:12px;color:var(--sub)}
mark{background:#ffe066;color:#000;border-radius:2px}
.cur{outline:2px solid #ffb300;outline-offset:2px}
#fab{position:fixed;left:14px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:12;width:42px;height:42px;border-radius:50%;border:0;background:var(--pill);color:var(--sub);box-shadow:0 2px 6px #0004;font-size:18px;cursor:pointer}
</style>
</head>

document.addEventListener('error',function(e){var el=e.target,k=el.tagName;if(k!=='IMG'&&k!=='VIDEO'&&k!=='AUDIO')return;var ic=k==='IMG'?(el.className==='stk'?'🙂':'🖼️'):k==='VIDEO'?'🎬':'🎤';var lb=k==='IMG'?(el.className==='stk'?'ستيكر':'صورة'):k==='VIDEO'?'فيديو':'رسالة صوتية';var d=document.createElement('div');d.className='miss';var fnm=nm(el.getAttribute('src')||'');d.innerHTML=ic+'<span>'+lb+' — مش لاقي:</span><span dir="ltr" style="user-select:all">'+fnm.replace(/</g,'&lt;')+'</span>';var t=k==='IMG'&&el.parentNode.className==='pic'?el.parentNode:el;d._o=t;t.replaceWith(d)},true);
$('bf').onclick=function(){$('fi').click()};
$('fi').onchange=function(){var fs=this.files,map={},n=0;for(var i=0;i<fs.length;i++)map[fs[i].name.toLowerCase()]=URL.createObjectURL(fs[i]);
var ms=ch.querySelectorAll('.miss');for(i=0;i<ms.length;i++){if(ms[i]._o)ms[i].replaceWith(ms[i]._o)}
var miss=[],els=ch.querySelectorAll('[src]');for(i=0;i<els.length;i++){var k=nm(els[i].getAttribute('src')).toLowerCase();if(map[k]){els[i].setAttribute('src',map[k]);n++;if(els[i].parentNode.className==='pic')els[i].parentNode.href=map[k]}else{miss.push(k)}}
var ls=ch.querySelectorAll('a.d');for(i=0;i<ls.length;i++){var k2=nm(ls[i].getAttribute('href')).toLowerCase();if(map[k2]){ls[i].href=map[k2];n++}else miss.push(k2)}
var jp=0;for(var kk in map)if(/\.jpe?g$/.test(kk))jp++;alert('تم ربط '+n+' ملف من '+fs.length+' ملف في الفولدر\nعدد ملفات jpg في الفولدر: '+jp+'\nعدد الملفات المذكورة في الشات ومش موجودة في الفولدر: '+miss.length);if(miss.length&&confirm('تنزّل قايمة بأسماء الملفات الناقصة؟')){var a=document.createElement('a');a.href=URL.createObjectURL(new Blob([miss.join('\r\n')],{type:'text/plain'}));a.download='missing_files.txt';a.click()}};
var hits=[],idx=-1;
function clear(){for(var i=0;i<hits.length;i++)hits[i].classList.remove('cur');hits=[];idx=-1;$('c').textContent=''}
function go(n){if(!hits.length)return;if(idx>=0)hits[idx].classList.remove('cur');idx=(n+hits.length)%hits.length;hits[idx].classList.add('cur');hits[idx].scrollIntoView({block:'center'});$('c').textContent=(idx+1)+' / '+hits.length}
function run(){clear();var v=q.value.trim().toLowerCase();if(!v)return;var all=ch.querySelectorAll('.m p');for(var i=0;i<all.length;i++){if(all[i].textContent.toLowerCase().indexOf(v)>-1)hits.push(all[i].parentNode)}if(!hits.length){$('c').textContent='لا نتائج';return}go(hits.length-1)}
q.addEventListener('keydown',function(e){if(e.key==='Enter'){if(hits.length&&q.dataset.l===q.value)go(e.shiftKey?idx+1:idx-1);else{q.dataset.l=q.value;run()}}});
$('pv').onclick=function(){go(idx-1)};$('nx').onclick=function(){go(idx+1)};
var z=document.getElementById('z');if(typeof DecompressionStream==='undefined'){ch.innerHTML='<p style="text-align:center;padding:40px">المتصفح ده قديم ومش بيدعم فتح الملف. استخدم Chrome أو Edge أو Firefox حديث.</p>'}else{var bin=atob(z.textContent.trim()),u=new Uint8Array(bin.length);for(var q0=0;q0<bin.length;q0++)u[q0]=bin.charCodeAt(q0);new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).text().then(function(t){ch.innerHTML=t;z.remove()})}})();
</script>
